global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus сам себя
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Бэкенд приложение
  - job_name: 'backend'
    static_configs:
      - targets: ['review_analysis_backend:3000']  # имя контейнера!
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Удали node-exporter если его нет
  # - job_name: 'node'
  #   static_configs:
  #     - targets: ['node-exporter:9100']
